name: Documentation Improvement
description: Suggest improvements to documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: repo
    attributes:
      label: Repository
      options:
        - agent-sandbox (CLI)
        - python-sdk
        - nodejs-sdk
        - awesome-templates
        - awesome-providers
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Documentation Page
      description: Which page needs improvement?
      placeholder: "URL or file path"
  - type: textarea
    id: description
    attributes:
      label: What needs to be improved?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
