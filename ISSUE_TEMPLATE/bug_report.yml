name: Bug Report
description: Report a bug in an Agent Sandbox repository that does not have its own issue forms
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

        File CLI bugs in https://github.com/alibaba-agent-sandbox/agent-sandbox
        Python SDK bugs belong in https://github.com/alibaba-agent-sandbox/python-sdk
        Node.js SDK bugs belong in https://github.com/alibaba-agent-sandbox/nodejs-sdk
        Template bugs belong in https://github.com/alibaba-agent-sandbox/awesome-templates
        Provider bugs belong in https://github.com/alibaba-agent-sandbox/awesome-providers
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CLI (abx)
        - Python SDK
        - Node.js SDK
        - Templates
        - Providers
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: Describe the bug...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Install the CLI `npm install -g @agent-sandbox/cli`
        2. Run `abx config init`
        3. Run `abx create --template base`
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "package version or git commit"
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux (Ubuntu)
        - Linux (CentOS/RHEL)
        - Linux (Other)
        - Windows
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
